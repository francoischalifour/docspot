name: Bug report
description: Did something not work?
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug!
        For security vulnerabilities, please use [private vulnerability reporting](https://github.com/francoischalifour/docspot/security/advisories/new) instead of opening a public issue.
  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: How to reproduce
      description: List the steps needed to reproduce the bug, with your Docspot props.
      placeholder: |
        1. Render <Docspot search={search} chat={chat} />
        2. Press ⌘K and type "install"
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: reproduction
    attributes:
      label: Reproducible example
      description: A link to a minimal reproduction, such as a fork of one of the examples.
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 140, Safari 26, Firefox 145, etc.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versions
      description: The versions of docspot, react, and, for chat, ai and @ai-sdk/react.
      placeholder: docspot 0.1.0, react 19.2.4, ai 5.0.0
    validations:
      required: true
